<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Événements à venir - Viéville</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 600px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2b4a6f;
            margin-bottom: 25px;
        }
        .event {
            background: #e8f1fb;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 6px solid #2b4a6f;
            border-radius: 6px;
        }
        .event h2 {
            margin: 0;
            color: #2b4a6f;
        }
        .event p {
            margin: 5px 0 0;
            color: #333;
        }
        .qr {
            text-align: center;
            margin-top: 30px;
        }
        .qr img {
            width: 200px;
        }
        .qr a {
            display: inline-block;
            margin-top: 10px;
            color: #2b4a6f;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>
<body>
<h1>Événements à venir</h1>
	<div style="float:left;width:30%;margin-right:1%;margin-top:3%">

		

		<div class="event">
			<h2>📚 1er septembre</h2>
			<p>Rentrée des classes</p>
		</div>

		<div class="event">
			<h2> 11 novembre</h2>
			<p>Commémoration au monument</p>
		</div>

		<div class="event">
			<h2>🎄 28 novembre</h2>
			<p>Marché de Noël</p>
		</div>

		<div class="event">
			<h2>🎅 19 décembre</h2>
			<p>Venue du Père Noël</p>
		</div>
	</div>
	<div style="float:left;width:65%">
		<img alt="" src="./image_vieville.png" width="100%" height="auto" />
	</div>

</body>
</html>
