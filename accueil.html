<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Relevés Compteurs Eau - Viéville</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<!-- Google Identity Services -->
<script src="https://accounts.google.com/gsi/client" async></script>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    display: flex;
    height: 100vh;
}
#sidebar {
    width: 350px;
    background: #f5f5f5;
    padding: 15px;
    overflow-y: auto;
    border-right: 2px solid #ccc;
}
#map {
    flex: 1;
}

/* MODAL */
#modal-bg {
    
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.5);
    justify-content: center;
    align-items: center;
    z-index: 9999; 
    display: flex;
}
#modal {
    background: white;
    padding: 20px;
    width: 400px;
    border-radius: 8px;
    box-shadow: 0 0 15px rgba(0,0,0,0.3);
}
#modal h3 {
    margin-top: 0;
}
input, textarea {
    width: 100%;
    margin-bottom: 10px;
    padding: 6px;
}
.address-item {
    padding: 8px;
    background: #fff;
    border: 1px solid #ddd;
    margin-bottom: 8px;
    cursor: pointer;
}
.address-item:hover {
    background: #e9f3ff;
}
</style>
</head>

<body>

<div id="sidebar">
    <h2>Relevés Compteurs</h2>

    <button onclick="ouvrirModal()">➕ Ajouter une adresse</button>

    <h3>Liste des adresses</h3>
    <div id="liste"></div>

    <h3>Historique des relevés</h3>
    <div id="historique"></div>
</div>

<div id="map"></div>

<!-- MODAL -->
<div id="modal-bg">
    <div id="modal">
        <h3>Ajouter une adresse</h3>

        <input id="nom" placeholder="Nom" />
        <input id="adresse" placeholder="Adresse" />
        <input id="compteur" placeholder="Numéro de compteur" />
        <input id="lng" placeholder="Longitude" />
        <input id="lat" placeholder="Latitude" />
        <textarea id="commentaire" placeholder="Commentaire"></textarea>
        <input type="file" id="photo" accept="image/*" />

        <button onclick="ajouterAdresse()">Ajouter</button>
        <button onclick="fermerModal()">Annuler</button>
    </div>
</div>

<script>
// =========================
// CONFIG GOOGLE
// =========================
const API_KEY = "AIzaSyDs56GR0C7xZOJ5UDS9cHy3X0Dd5n5lzZs";
const CLIENT_ID = "889221840439-i113qnd2rmokhl20s6g3rj1v2ti02sek.apps.googleusercontent.com";
const SPREADSHEET_ID = "1oGKXSkD3GMGt2yXm1tDoPg8fEjC_yg0ttBqD1VFqGXo";
const RANGE = "adresses!A:H";

let googleAccessToken = null;

// =========================
// AUTH GOOGLE
// =========================
function ensureGoogleLogin() {
    return new Promise(resolve => {
        if (googleAccessToken) return resolve(googleAccessToken);

        google.accounts.oauth2.initTokenClient({
            client_id: CLIENT_ID,
            scope: "https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/drive.file",
            callback: (response) => {
                googleAccessToken = response.access_token;
                resolve(googleAccessToken);
            }
        }).requestAccessToken();
    });
}

// =========================
// APPELS GOOGLE SHEETS
// =========================
async function sheetsGet(range) {
    const token = await ensureGoogleLogin();
    const res = await fetch(
        `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(range)}`,
        { headers: { Authorization: "Bearer " + token } }
    );
    return res.json();
}

async function sheetsAppend(range, values) {
    const token = await ensureGoogleLogin();
    const res = await fetch(
        `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(range)}:append?valueInputOption=USER_ENTERED`,
        {
            method: "POST",
            headers: {
                Authorization: "Bearer " + token,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ values })
        }
    );
    return res.json();
}

async function sheetsUpdate(range, values) {
    const token = await ensureGoogleLogin();
    const res = await fetch(
        `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(range)}?valueInputOption=USER_ENTERED`,
        {
            method: "PUT",
            headers: {
                Authorization: "Bearer " + token,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ values })
        }
    );
    return res.json();
}

// =========================
// VARIABLES
// =========================
let data = [];
let map;
let markers = {};

// =========================
// MODAL
// =========================
function ouvrirModal() {
    document.getElementById("modal-bg").style.display = "flex";
}
function fermerModal() {
    document.getElementById("modal-bg").style.display = "none";
}

// =========================
// CHARGEMENT DES DONNÉES
// =========================
async function chargerJSON() {
    const json = await sheetsGet(RANGE);
    const rows = json.values || [];

    data = rows.slice(1).map((r, i) => ({
        nom: r[0] || "",
        adresse: r[1] || "",
        compteur: r[2] || "",
        commentaire: r[3] || "",
        photo_url: r[4] || "",
        lat: parseFloat(r[5]) || 48.2,
        lng: parseFloat(r[6]) || 5.2,
        releves: r[7] ? JSON.parse(r[7]) : [],
        rowIndex: i + 2
    }));

    initMap();
    afficherListe();
}

// =========================
// CARTE
// =========================
function initMap() {
    map = L.map('map').setView([48.2, 5.2], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19
    }).addTo(map);

    data.forEach(addr => ajouterMarker(addr));
}

function ajouterMarker(addr) {
    const marker = L.marker([addr.lat, addr.lng]).addTo(map);
    marker.bindPopup(`<strong>${addr.nom}</strong><br>${addr.adresse}<br>Compteur ${addr.compteur}`);
    markers[addr.compteur] = marker;
}

// =========================
// LISTE
// =========================
function afficherListe() {
    const div = document.getElementById("liste");
    div.innerHTML = "";

    data.forEach((addr, index) => {
        const item = document.createElement("div");
        item.className = "address-item";
        item.innerHTML = `
            <strong>${addr.nom}</strong><br>
            ${addr.adresse}<br>
            Compteur : ${addr.compteur}
        `;
        item.onclick = () => afficherHistorique(index);
        div.appendChild(item);
    });
}

// =========================
// AJOUT ADRESSE
// =========================
async function ajouterAdresse() {
    const nom = document.getElementById("nom").value.trim();
    const adresse = document.getElementById("adresse").value.trim();
    const compteur = document.getElementById("compteur").value.trim();
    const lat = document.getElementById("lat").value.trim();
    const lng = document.getElementById("lng").value.trim();
    const commentaire = document.getElementById("commentaire").value.trim();
    const photoFile = document.getElementById("photo").files[0];

    if (!nom || !adresse || !compteur) {
        alert("Nom, adresse et compteur sont obligatoires.");
        return;
    }

    let photoURL = "";
    if (photoFile) {
        photoURL = await uploadPhotoToDrive(photoFile);
    }

    const newEntry = {
        nom,
        adresse,
        compteur,
        commentaire,
        photo_url: photoURL,
        lat,
        lng,
        releves: []
    };

    await sheetsAppend(RANGE, [[
        newEntry.nom,
        newEntry.adresse,
        newEntry.compteur,
        newEntry.commentaire,
        newEntry.photo_url,
        newEntry.lat,
        newEntry.lng,
        JSON.stringify(newEntry.releves)
    ]]);

    newEntry.rowIndex = data.length + 2;
    data.push(newEntry);

    ajouterMarker(newEntry);
    afficherListe();
    fermerModal();
}

// =========================
// HISTORIQUE
// =========================
function afficherHistorique(index) {
    const div = document.getElementById("historique");
    const addr = data[index];

    div.innerHTML = `
        <h4>${addr.nom}</h4>
        <p>${addr.adresse}</p>
        <p>Compteur : ${addr.compteur}</p>
        <p>${addr.commentaire}</p>
        ${addr.photo_url ? `<img src="${addr.photo_url}" width="200">` : ""}
        <h4>Relevés</h4>
        <ul>
            ${addr.releves.map(r => `<li>${r.date} : ${r.valeur}</li>`).join("")}
        </ul>
        <input id="relValeur" placeholder="Valeur relevé">
        <input id="relDate" type="date">
        <button onclick="ajouterReleve(${index})">Ajouter relevé</button>
    `;

    const marker = markers[addr.compteur];
    if (marker) {
        marker.openPopup();
        map.setView(marker.getLatLng(), 18);
    }
}

// =========================
// AJOUT RELEVÉ
// =========================
async function ajouterReleve(index) {
    const val = document.getElementById("relValeur").value.trim();
    const date = document.getElementById("relDate").value;

    if (!val || !date) {
        alert("Valeur et date obligatoires.");
        return;
    }

    data[index].releves.push({ valeur: val, date });

    const range = `adresses!H${data[index].rowIndex}`;
    await sheetsUpdate(range, [[JSON.stringify(data[index].releves)]]);

    afficherHistorique(index);
}

// =========================
// UPLOAD PHOTO DRIVE
// =========================
async function uploadPhotoToDrive(file) {
    const token = await ensureGoogleLogin();

    const metadata = {
        name: file.name,
        mimeType: file.type
    };

    const form = new FormData();
    form.append("metadata", new Blob([JSON.stringify(metadata)], { type: "application/json" }));
    form.append("file", file);

    const res = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart", {
        method: "POST",
        headers: { Authorization: "Bearer " + token },
        body: form
    });

    const fileData = await res.json();

    await fetch(`https://www.googleapis.com/drive/v3/files/${fileData.id}/permissions`, {
        method: "POST",
        headers: {
            Authorization: "Bearer " + token,
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ role: "reader", type: "anyone" })
    });

    return `https://drive.google.com/uc?id=${fileData.id}`;
}

// =========================
// DÉMARRAGE
// =========================
window.addEventListener("load", () => {
    chargerJSON();
});
</script>

</body>
</html>
